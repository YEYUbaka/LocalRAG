name: 💡 功能建议
description: 提出新功能或改进建议
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 感谢提议！描述清楚使用场景能大大提高被采纳的概率。大功能建议先在 Discussions 发帖讨论。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 要解决的问题
      description: 你在什么情况下需要这个功能？现在是怎么绕过去的？
      placeholder: 我经常需要……但目前只能……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？（界面交互、接口行为等）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法，或参考的其他产品（如 RAGFlow、AnythingLLM）的实现。
  - type: dropdown
    id: local_first
    attributes:
      label: 本地优先边界自查
      description: LocalRAG 的红线是原始文档与向量索引留在本地。你的提案是否会把用户原始文档上传到第三方服务？
      options:
        - 不涉及，数据仍完全留在本地
        - 涉及，但只发送脱敏后的检索片段给 LLM
        - 会发送原始文档（请在方案中说明理由）
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: 是否愿意提交 PR 实现？
      options:
        - 愿意
        - 愿意，但需要维护者指导
        - 暂时不愿意
    validations:
      required: true
